[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afdm-jadcedd"
version = "0.4.0"
description = "AFDM JADCE: full-channel score message passing"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "scipy", "torch", "threadpoolctl", "PyYAML", "matplotlib"]

[project.scripts]
jadce = "afdm_jadcedd.experiment.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"afdm_jadcedd" = ["LICENSE.cai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
